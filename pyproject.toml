[project]
name = "abtest-analysis"
version = "0.4.0"
description = "Analyze the effects of an AB test using Python"
authors = [
    {name = "ConorMcNamara",email = "conor.s.mcnamara@gmail.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.16.1",
    "tabulate>=0.9.0,<0.10.0",
    "pandas>=2.2.3,<3.0.0",
    "polars>=1.27.1,<2.0.0",
    "plotly>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
# Optional DataFrame backends for ContingencyTable.to_df(method=...).
# Install only the backend you need, e.g. `uv sync --extra pyspark`.
pyspark = ["pyspark"]
modin = ["modin[dask]"]
ibis = ["ibis-framework"]
narwhals = ["narwhals"]
sklearn = ["scikit-learn>=1.0"]
dev = [
    "pytest>=8.4.2,<9.0.0",
    "pytest-cov>=6.0.0",
    "zuban>=0.1.0",
    "ruff>=0.15,<0.16",
    "types-tabulate",
    "pandas-stubs~=2.3.3",
    "scipy-stubs~=1.17.1",
    "pyspark-stubs>=3.0.0.post3",
]


[project.urls]
Homepage = "https://github.com/ConorMcNamara/ab_test"
Repository = "https://github.com/ConorMcNamara/ab_test"
Issues = "https://github.com/ConorMcNamara/ab_test/issues"

[build-system]
requires = ["uv_build>=0.10,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the ab_test package lives at the repo root, not under src/.
module-root = ""
module-name = "ab_test"

[tool.pytest.ini_options]
pythonpath = ["ab_test", '.']
addopts = "--cov=ab_test --cov-report=term-missing --cov-report=xml"
markers = ["slow: computationally expensive tests (Monte Carlo, exact combinatorial)"]

[tool.coverage.run]
source = ["ab_test"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.zuban]
follow_untyped_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unreachable = true
allow_untyped_globals = false
exclude_gitignore = true
mode = "default"  # Or "mypy"

# Recommended (and the default) for untyped code
untyped_strict_optional = true

# Mypy's default is "any", Zuban's "inferred"
untyped_function_return_mode = "inferred"

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
